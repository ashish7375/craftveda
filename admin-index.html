 </div>

 <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:2px">
  <div style="font-size:13px;font-weight:600">Sizes (inches) and prices</div>
  <small style="color:var(--gr);font-size:12px">Auto-filled by shape; edit prices below</small>
 </div>
 <div id="szr">${it.sizes.map(s => sizeRow(s[0], s[1])).join("")}</div>
 <span id="sz-err" class="f-err" style="margin-bottom:8px"></span>
 <button type="button" class="ghost" id="addsz" style="margin-bottom:14px;display:inline-flex;align-items:center;gap:6px"><i data-lucide="plus" style="width:14px;height:14px"></i><span>Add custom size</span></button>

 <!-- Description with AI Assistant -->
 <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">
  <div style="font-size:13px;font-weight:600">Description</div>
  
 </div>
 <textarea id="fd" rows="3" placeholder="Description of the artwork...">${esc(it.desc)}</textarea>
 

 <!-- Image Slots with Drag-and-Drop, Reordering & Crop Preview -->
 <div style="margin-top:10px">
  <div style="font-size:13px;font-weight:600">Artwork Images (1080 &times; 1350)</div>
  <small style="color:var(--gr);font-size:12px">Drag & drop photos onto slots or click to choose. Use arrow buttons to reorder slots.</small>
 </div>

 <div class="imgs">
  ${[
                    { title: "1. Room / Mockup", desc: "Hero lifestyle mockup", fit: "cover", fitLabel: "Cover (fills canvas)", req: true },
                    { title: "2. Main Artwork", desc: "White background view", fit: "contain", fitLabel: "Full View (No Crop)", req: false },
                    { title: "3. Side View", desc: "Texture close-up angle", fit: "contain", fitLabel: "Full View (No Crop)", req: false }
                ].map((slot, k) => `
   <div class="im-slot" data-slot="${k}">
    <div class="im-slot-title">${slot.title}${slot.req ? ' *' : ''}</div>
    <div class="pv-zone ${slot.fit}" id="pv${k}" title="Click or drag image here">
     <div id="pv-content${k}" style="width:100%;height:100%;display:grid;place-items:center">
      ${imgs[k] ? `<img src="${esc(imgs[k])}" alt="">` : `<span style="font-size:12px;text-align:center;padding:10px">${slot.desc}<br><small style="color:var(--cu);font-weight:600;display:inline-flex;align-items:center;gap:4px;justify-content:center"><i data-lucide="upload" style="width:11px;height:11px"></i><span>Upload</span></small></span>`}
     </div>
     <div class="pv-actions" id="pv-act${k}" style="display:${imgs[k] || slotFiles[k] ? 'flex' : 'none'}">
      ${k > 0 ? `<button type="button" class="pv-btn" data-mv="${k},${k - 1}" title="Swap with slot ${k}" style="display:inline-flex;align-items:center;justify-content:center"><i data-lucide="arrow-left" style="width:13px;height:13px"></i></button>` : ''}
      ${k < 2 ? `<button type="button" class="pv-btn" data-mv="${k},${k + 1}" title="Swap with slot ${k + 2}" style="display:inline-flex;align-items:center;justify-content:center"><i data-lucide="arrow-right" style="width:13px;height:13px"></i></button>` : ''}
      <button type="button" class="pv-btn" data-rm="${k}" title="Remove image" style="background:#B3261E;display:inline-flex;align-items:center;justify-content:center"><i data-lucide="trash-2" style="width:13px;height:13px"></i></button>
     </div>
    </div>
    <span class="pv-fit-badge ${slot.fit}">${slot.fitLabel}</span>
    <input type="file" accept="image/*" id="fi${k}" style="display:none">
    <span id="img${k}-err" class="f-err"></span>
   </div>
  `).join("")}
 </div>
 <p class="note" style="margin-top:8px">${isNew ? "The room / mockup image is required for publishing. " : "Choose a file only if you want to replace that image. "}Photos are resized client-side to 1080 &times; 1350 automatically.</p>

 <label class="chk" style="margin-top:12px"><input type="checkbox" id="fp" ${it.published !== false ? "checked" : ""}> Publish (show live on website)</label>
 <label class="chk"><input type="checkbox" id="ff" ${it.featured ? "checked" : ""}> Featured (show in Favorites)</label>
 <div class="fa"><button class="btn" type="submit" style="display:inline-flex;align-items:center;gap:6px"><i data-lucide="check" style="width:14px;height:14px"></i><span>Save Artwork</span></button><button type="button" class="ghost" id="cn" style="display:inline-flex;align-items:center;gap:6px"><i data-lucide="x" style="width:14px;height:14px"></i><span>Cancel</span></button></div></form>`;

            $("#modal").hidden = false;

            /* Auto-fill 3 standard sizes for selected Shape, preserving any entered prices */
            const applyShapeSizes = (preservePrices = true) => {
                const sh = $("#fsh").value;
                const stdSizes = SHAPE_SIZES[sh] || SHAPE_SIZES["Horizontal"];
                const curTpl = templates.find(t => selectedCats.includes(t.category)) || DEFAULT_TEMPLATES.find(t => selectedCats.includes(t.category));
                const tplPrices = curTpl && curTpl.sizes ? curTpl.sizes.map(s => s[1]) : ["", "", ""];

                const currentRows = [...document.querySelectorAll(".sr")];
                const currentPrices = currentRows.map(r => r.querySelector(".pr").value.trim());

                const newRows = stdSizes.map((sz, idx) => {
                    let pr = "";
                    if (preservePrices && currentPrices[idx] && +currentPrices[idx] > 0) {
                        pr = currentPrices[idx];
                    } else if (tplPrices[idx]) {
                        pr = tplPrices[idx];
                    }
                    return sizeRow(sz, pr);
                });

                $("#szr").innerHTML = newRows.join("");
                $("#sz-err").textContent = "";
            };

            const updateThemesDropdown = () => {
                const availableThemes = [];
                selectedCats.forEach(c => {
                    const list = THEMES[c] || [];
                    list.forEach(th => {
                        if (!availableThemes.some(x => x.theme === th)) {
                            availableThemes.push({ category: c, theme: th });
                        }
                    });
                });

                const thw = $("#fthw");
                const thSelect = $("#fth");
                if (!availableThemes.length) {
                    thw.hidden = true;
                    thSelect.innerHTML = "";
                } else {
                    thw.hidden = false;
                    const curTheme = it.theme || "";
                    if (selectedCats.filter(c => THEMES[c] && THEMES[c].length).length > 1) {
                        thSelect.innerHTML = `<option value="">None / General</option>` + selectedCats.map(c => {
                            const thList = THEMES[c] || [];
                            if (!thList.length) return "";
                            return `<optgroup label="${esc(c)} Themes">${thList.map(th => `<option value="${esc(th)}" ${th === curTheme ? "selected" : ""}>${esc(th)}</option>`).join("")}</optgroup>`;
                        }).join("");
                    } else {
                        thSelect.innerHTML = `<option value="">None / General</option>` + availableThemes.map(x => `<option value="${esc(x.theme)}" ${x.theme === curTheme ? "selected" : ""}>${esc(x.theme)}</option>`).join("");
                    }
                }
            };

            updateThemesDropdown();

            document.querySelectorAll("[data-cat-badge]").forEach(badge => {
                badge.onclick = () => {
                    const cat = badge.dataset.catBadge;
                    const idx = selectedCats.indexOf(cat);
                    if (idx >= 0) {
                        if (selectedCats.length > 1) {
                            selectedCats.splice(idx, 1);
                        } else {
                            toast("Artwork must have at least one category badge", 1);
                            return;
                        }
                    } else {
                        selectedCats.push(cat);
                    }

                    document.querySelectorAll("[data-cat-badge]").forEach(b => {
                        const isSel = selectedCats.includes(b.dataset.catBadge);
                        b.classList.toggle("selected", isSel);
                        
                        
                    });

                    const countEl = $("#cat-badge-count");
                    if (countEl) countEl.textContent = `${selectedCats.length} selected`;
                    const errEl = $("#fc-err");
                    if (errEl) errEl.textContent = "";

                    updateThemesDropdown();
                    if (isNew) {
                        const newTpl = templates.find(t => selectedCats.includes(t.category)) || DEFAULT_TEMPLATES.find(t => selectedCats.includes(t.category));
                        if (newTpl) {
                            if (newTpl.shape && !$("#fsh").value) $("#fsh").value = newTpl.shape;
                            if (newTpl.desc && !$("#fd").value) $("#fd").value = newTpl.desc;
                        }
                        applyShapeSizes(false);
                    }
                };
            });

            $("#fsh").onchange = () => { applyShapeSizes(true) };

            $("#addsz").onclick = () => { $("#szr").insertAdjacentHTML("beforeend", sizeRow()); $("#sz-err").textContent = ""; initIcons(); };
            $("#szr").onclick = e => {
                if (e.target.classList.contains("x") && document.querySelectorAll(".sr").length > 1) {
                    e.target.closest(".sr-wrap").remove();
                }
            };

            /* AI Draft Description Button */
            if ($("#ai-draft-btn")) $("#ai-draft-btn").onclick = () => {
                const name = $("#fn").value;
                const cat = selectedCats.join(", ");
                const theme = $("#fthw").hidden ? "" : $("#fth").value;
                const shape = $("#fsh").value;
                const drafted = generateAIDescription(name, cat, theme, shape);

                $("#fd").value = drafted;
                $("#fd").style.borderColor = "var(--cu)";
                const msgEl = $("#ai-msg");
                msgEl.style.display = "block";
                msgEl.innerHTML = '<span style="display:inline-flex;align-items:center;gap:5px"><i data-lucide="sparkles" style="width:13px;height:13px"></i><span>Drafted with AI — please review, personalize or edit before saving.</span></span>'; initIcons();
                setTimeout(() => { if ($("#fd")) $("#fd").style.borderColor = "var(--ln)" }, 2000);
            };

            /* Image Slot Drag-and-Drop and Reordering Handlers */
            function updateSlotPreview(k) {
                const cntEl = $("#pv-content" + k);
                const actEl = $("#pv-act" + k);
                const errEl = $("#img" + k + "-err");
                if (errEl) errEl.textContent = "";
                $("#pv" + k).classList.remove("is-err");

                const hasImg = imgs[k] || slotFiles[k];
                if (slotFiles[k]) {
                    cntEl.innerHTML = `<img src="${URL.createObjectURL(slotFiles[k])}" alt="">`;
                    actEl.style.display = "flex";
                } else if (imgs[k]) {
                    cntEl.innerHTML = `<img src="${esc(imgs[k])}" alt="">`;
                    actEl.style.display = "flex";
                } else {
                    const slotDesc = ["Hero lifestyle mockup", "White background view", "Texture close-up angle"][k];
                    cntEl.innerHTML = `<span style="font-size:12px;text-align:center;padding:10px">${slotDesc}<br><small style="color:var(--cu);font-weight:600;display:inline-flex;align-items:center;gap:4px;justify-content:center"><i data-lucide="upload" style="width:11px;height:11px"></i><span>Upload</span></small></span>`; initIcons();
                    actEl.style.display = "none";
                }
            }

            [0, 1, 2].forEach(k => {
                const dropzone = $("#pv" + k);
                const fileInput = $("#fi" + k);

                dropzone.onclick = e => {
                    if (e.target.closest(".pv-actions")) return;
                    fileInput.click();
                };

                fileInput.onchange = e => {
                    const f = e.target.files[0];
                    if (f) {
                        slotFiles[k] = f;
                        updateSlotPreview(k);
                    }
                };

                dropzone.ondragover = e => {
                    e.preventDefault();
                    dropzone.classList.add("dragover");
                };
                dropzone.ondragleave = () => {
                    dropzone.classList.remove("dragover");
                };
                dropzone.ondrop = e => {
                    e.preventDefault();
                    dropzone.classList.remove("dragover");
                    if (e.dataTransfer.files && e.dataTransfer.files[0]) {
                        slotFiles[k] = e.dataTransfer.files[0];
                        updateSlotPreview(k);
                    }
                };
            });

            /* Swap / Remove Image Actions */
            $("#mb").onclick = e => {
                const rmBtn = e.target.closest("[data-rm]");
                if (rmBtn) {
                    const idx = +rmBtn.dataset.rm;
                    imgs[idx] = "";
                    slotFiles[idx] = null;
                    $("#fi" + idx).value = "";
                    updateSlotPreview(idx);
                    return;
                }

                const mvBtn = e.target.closest("[data-mv]");
                if (mvBtn) {
                    const [from, to] = mvBtn.dataset.mv.split(",").map(Number);
                    const tempImg = imgs[from]; imgs[from] = imgs[to]; imgs[to] = tempImg;
                    const tempFile = slotFiles[from]; slotFiles[from] = slotFiles[to]; slotFiles[to] = tempFile;
                    updateSlotPreview(from);
                    updateSlotPreview(to);
                    return;
                }
            };

            /* Error clearing */
            $("#fn").oninput = () => {
                if ($("#fn").value.trim()) { $("#fn").classList.remove("is-err"); $("#fn-err").textContent = "" }
            };
            $("#szr").oninput = e => {
                if (e.target.classList.contains("sz") || e.target.classList.contains("pr")) {
                    e.target.classList.remove("is-err");
                    const wrap = e.target.closest(".sr-wrap");
                    if (wrap) { const err = wrap.querySelector(".f-err"); if (err) err.textContent = "" }
                    $("#sz-err").textContent = "";
                }
            };

            /* Snapshot for dirty form checking */
            const getSnapshot = () => JSON.stringify({
                n: $("#fn").value.trim(),
                c: selectedCats.join(", "),
                th: $("#fthw").hidden ? "" : $("#fth").value,
                sh: $("#fsh").value,
                sz: [...document.querySelectorAll(".sr")].map(r => [r.querySelector(".sz").value.trim(), r.querySelector(".pr").value.trim()]),
                d: $("#fd").value.trim(),
                p: $("#fp").checked,
                f: $("#ff").checked,
                fl: slotFiles.map(f => f ? f.name : ""),
                im: imgs
            });
            const initialSnapshot = getSnapshot();
            const discardIfDirty = () => {
                if (getSnapshot() !== initialSnapshot) {
                    return confirm("Discard unsaved changes?");
                }
                return true;
            };

            $("#cn").onclick = () => { if (discardIfDirty()) $("#modal").hidden = true };
            $("#modal").onclick = e => { if (e.target.id === "modal" && discardIfDirty()) $("#modal").hidden = true };

            $("#af").onsubmit = async e => {
                e.preventDefault();

                let isValid = true;
                document.querySelectorAll(".is-err").forEach(el => el.classList.remove("is-err"));
                document.querySelectorAll(".f-err").forEach(el => el.textContent = "");

                const name = $("#fn").value.trim();
                if (!name) {
                    $("#fn").classList.add("is-err");
                    $("#fn-err").textContent = "Artwork name is required.";
                    isValid = false;
                } else if (data.items.some(x => x.name.toLowerCase() === name.toLowerCase() && x.id !== it.id)) {
                    $("#fn").classList.add("is-err");
                    $("#fn-err").textContent = "Another artwork already has this name.";
                    isValid = false;
                }

                const srWraps = [...document.querySelectorAll(".sr-wrap")];
                const validSizes = [];
                srWraps.forEach(wrap => {
                    const szIn = wrap.querySelector(".sz");
                    const prIn = wrap.querySelector(".pr");
                    const errEl = wrap.querySelector(".f-err");
                    const sVal = szIn.value.trim();
                    const pVal = +prIn.value;

                    let rowErr = "";
                    if (!sVal && pVal > 0) {
                        szIn.classList.add("is-err");
                        rowErr = "Size cannot be empty.";
                    } else if (sVal && (!pVal || pVal <= 0)) {
                        prIn.classList.add("is-err");
                        rowErr = "Price must be greater than 0.";
                    } else if (sVal && pVal > 0) {
                        validSizes.push([sVal, pVal]);
                    }
                    if (rowErr) { errEl.textContent = rowErr; isValid = false }
                });

                if (!validSizes.length) {
                    $("#sz-err").textContent = "Add at least one size with a valid price.";
                    isValid = false;
                }

                if (isNew && !slotFiles[0] && !imgs[0]) {
                    $("#pv0").classList.add("is-err");
                    $("#img0-err").textContent = "The room / mockup image is required for new artworks.";
                    isValid = false;
                }

                if (!selectedCats.length) {
                    $("#fc-err").textContent = "Please select at least one category badge.";
                    isValid = false;
                }

                if (!isValid) {
                    const firstErr = document.querySelector(".is-err");
                    if (firstErr) firstErr.focus();
                    return toast("Please fix the errors marked in red", 1);
                }

                const btn = e.submitter; btn.disabled = true;
                try {
                    const out = [...imgs];
                    for (let k = 0; k < 3; k++)if (slotFiles[k]) {
                        busy(`Uploading image ${k + 1}...`);
                        const b = await toJpeg(slotFiles[k], k ? "contain" : "cover");
                        out[k] = await putImage(`${slug(name)}-${k + 1}-${Date.now().toString(36)}.jpg`, b);
                    }
                    const now = new Date().toISOString();
                    const rec = {
                        id: it.id || Date.now().toString(36),
                        name,
                        category: selectedCats.join(", "),
                        categories: selectedCats,
                        theme: $("#fthw").hidden ? "" : $("#fth").value,
                        shape: $("#fsh").value,
                        sizes: validSizes,
                        desc: $("#fd").value.trim(),
                        images: out.filter(Boolean),
                        published: $("#fp").checked,
                        featured: $("#ff").checked,
                        createdAt: it.createdAt || now,
                        updatedAt: now
                    };
                    busy("Saving...");
                    const before = JSON.stringify(data.items);
                    const ix = data.items.findIndex(x => x.id === rec.id);
                    if (ix >= 0) data.items[ix] = rec; else data.items.push(rec);
                    try { await save((isNew ? "Add " : "Update ") + name) } catch (x) { data.items = JSON.parse(before); throw x }

                    // Clean up any replaced or removed images from the previous revision
                    if (!isNew && it.images && Array.isArray(it.images)) {
                        const replaced = it.images.filter(p => p && !rec.images.includes(p));
                        for (const oldP of replaced) {
                            if (!isImageInUse(oldP, rec.id)) {
                                busy("Cleaning up replaced image...");
                                await delImage(oldP);
                            }
                        }
                    }

                    $("#modal").hidden = true;
                    toast("Saved. It will be live on the website in 1 to 2 minutes.");
                    render();
                } catch (x) { toast(x.message, 1) } finally { btn.disabled = false }
            };
        }
    </script>
</body>

</html>
