<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex,nofollow">
    <title>CraftVeda Admin</title>
    <!-- Lucide Icons CDN -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root {
            --navy: #0F2740;
            --navy-light: #1A3859;
            --cu: #B5654A;
            --cu-hover: #9C523A;
            --bg: #F5F3EF;
            --surface: #FFFFFF;
            --ln: #E3DFD7;
            --ln-strong: #CDC8BE;
            --gr: #5E6672;
            --gr-light: #8F97A3;
            --ok: #1B7F4B;
            --ok-bg: #EAF7EE;
            --ok-border: #BCE5CB;
            --bad: #B3261E;
            --bad-bg: #FDF2F2;
            --warn: #B45309;
            --warn-bg: #FEF3C7;
            --warn-border: #FDE68A;
            --sb-w: 256px;
            --radius-sm: 5px;
            --radius: 8px;
            --radius-lg: 12px;
            --shadow-sm: 0 1px 3px rgba(15, 39, 64, .05);
            --shadow: 0 3px 10px rgba(15, 39, 64, .07);
            --shadow-lg: 0 12px 32px rgba(15, 39, 64, .15);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: var(--bg);
            color: var(--navy);
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
        }

        [hidden] {
            display: none !important
        }

        button,
        input,
        select,
        textarea {
            font: inherit;
            color: inherit
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 10px 13px;
            border: 1px solid var(--ln);
            background: #fff;
            border-radius: var(--radius-sm);
            transition: border-color .18s, box-shadow .18s;
            font-size: 13.5px;
        }

        input:focus,
        select:focus,
        textarea:focus {
            outline: none;
            border-color: var(--cu);
            box-shadow: 0 0 0 3px rgba(181, 101, 74, .15);
        }

        label {
            display: grid;
            gap: 6px;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 14px;
            color: var(--navy)
        }

        .btn {
            background: var(--cu);
            color: #fff;
            border: 0;
            padding: 10px 18px;
            border-radius: var(--radius-sm);
            cursor: pointer;
            font-weight: 600;
            font-size: 13px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: background .18s, transform .1s;
        }

        .btn:hover {
            background: var(--cu-hover)
        }

        .btn:active {
            transform: scale(.98)
        }

        .btn:disabled {
            opacity: .55;
            cursor: not-allowed;
            transform: none
        }

        .btn.navy-btn {
            background: var(--navy)
        }

        .btn.navy-btn:hover {
            background: var(--navy-light)
        }

        .ghost {
            background: #fff;
            border: 1px solid var(--ln);
            color: var(--navy);
            padding: 9px 15px;
            border-radius: var(--radius-sm);
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            font-weight: 500;
            font-size: 13px;
            transition: all .18s;
        }

        .ghost:hover {
            border-color: var(--navy);
            background: #FAF9F7
        }

        .dng {
            color: var(--bad)
        }

        .dng:hover {
            background: var(--bad-bg);
            border-color: var(--bad)
        }

        /* Layout & Sidebar */
        .layout {
            display: flex;
            min-height: 100vh
        }

        .sidebar {
            width: var(--sb-w);
            background: var(--navy);
            color: #fff;
            height: 100vh;
            position: fixed;
            top: 0;
            left: 0;
            display: flex;
            flex-direction: column;
            z-index: 25;
            transition: transform .24s cubic-bezier(.2, .8, .2, 1);
            overflow-y: auto;
        }

        .sb-header {
            padding: 20px 18px 14px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid rgba(255, 255, 255, .08);
        }

        .sb-brand {
            display: flex;
            align-items: center;
            gap: 11px
        }

        .sb-logo {
            width: 34px;
            height: 34px;
            background: var(--cu);
            color: #fff;
            border-radius: var(--radius-sm);
            display: grid;
            place-items: center;
            font-weight: 800;
            font-size: 14px;
            letter-spacing: .5px;
            box-shadow: 0 2px 6px rgba(0, 0, 0, .25);
        }

        .sb-title-wrap b {
            display: block;
            font-size: 16px;
            line-height: 1.2;
            color: #fff;
            letter-spacing: -.2px
        }

        .sb-title-wrap small {
            font-size: 11px;
            color: #94A3B8;
            text-transform: uppercase;
            letter-spacing: .8px
        }



        .sb-cta {
            padding: 16px 14px 10px
        }

        .sb-add-btn {
            width: 100%;
            background: var(--cu);
            color: #fff;
            border: 0;
            padding: 11px 14px;
            border-radius: var(--radius-sm);
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: background .18s;
            box-shadow: 0 2px 6px rgba(0, 0, 0, .2);
        }

        .sb-add-btn:hover {
            background: var(--cu-hover)
        }

        .sb-nav {
            padding: 10px 14px;
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 3px
        }

        .sb-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 9px 12px;
            border-radius: var(--radius-sm);
            color: #CBD5E1;
            background: none;
            border: 0;
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
            width: 100%;
            text-align: left;
            transition: all .15s ease;
        }

        .sb-item:hover {
            background: rgba(255, 255, 255, .08);
            color: #fff
        }

        .sb-item.on {
            background: rgba(255, 255, 255, .16);
            color: #fff;
            font-weight: 600
        }

        /* Lucide Icons Base */
        .lucide {
            width: 18px;
            height: 18px;
            stroke-width: 2;
            vertical-align: middle;
            display: inline-block;
        }

        .sb-item .lucide,
        .sb-item svg,
        .sb-item i {
            width: 18px;
            height: 18px;
            flex-shrink: 0;
            opacity: .85;
        }

        .sb-item.on .lucide,
        .sb-item.on svg,
        .sb-item.on i {
            opacity: 1;
        }

        .sb-logout-btn .lucide,
        .sb-logout-btn svg,
        .sb-logout-btn i {
            width: 15px;
            height: 15px;
            flex-shrink: 0;
        }

        .sb-toggle-btn .lucide,
        .sb-toggle-btn svg,
        .sb-toggle-btn i {
            width: 18px;
            height: 18px;
        }

        .sb-badge {
            margin-left: auto;
            background: rgba(255, 255, 255, .18);
            color: #fff;
            padding: 2px 7px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 700;
        }

        .sb-footer {
            padding: 14px;
            border-top: 1px solid rgba(255, 255, 255, .08);
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .sb-kbd-tip {
            font-size: 11px;
            color: #94A3B8;
            text-align: center
        }

        .sb-kbd-tip kbd {
            background: rgba(255, 255, 255, .12);
            padding: 2px 5px;
            border-radius: 3px;
            font-family: monospace;
            color: #fff;
        }

        .sb-logout-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            background: rgba(255, 255, 255, .06);
            border: 1px solid rgba(255, 255, 255, .12);
            color: #CBD5E1;
            padding: 8px 12px;
            border-radius: var(--radius-sm);
            cursor: pointer;
            font-size: 12px;
            font-weight: 500;
            transition: all .18s;
        }

        .sb-logout-btn:hover {
            background: rgba(255, 255, 255, .14);
            color: #fff;
            border-color: rgba(255, 255, 255, .24)
        }

        .sb-backdrop {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(10, 20, 32, .5);
            z-index: 20;
        }

        /* Content Area */
        .content-wrap {
            flex: 1;
            margin-left: var(--sb-w);
            min-width: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            transition: margin-left .24s cubic-bezier(.2, .8, .2, 1);
        }

        /* Dynamic Collapsible Sidebar States (Desktop) */
        body.sb-closed .sidebar {
            transform: translateX(-100%);
        }

        body.sb-closed .content-wrap {
            margin-left: 0;
        }

        body.sb-closed .bulk-bar {
            left: 50%;
        }

        .top-header {
            height: 62px;
            background: #fff;
            border-bottom: 1px solid var(--ln);
            position: sticky;
            top: 0;
            z-index: 15;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 24px;
            gap: 16px;
        }

        .top-left {
            display: flex;
            align-items: center;
            gap: 14px
        }

        .sb-toggle-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background: #fff;
            border: 1px solid var(--ln);
            color: var(--navy);
            width: 34px;
            height: 34px;
            cursor: pointer;
            border-radius: var(--radius-sm);
            transition: all .18s;
        }

        .sb-toggle-btn:hover {
            background: var(--bg);
            border-color: var(--navy);
            color: var(--cu);
        }

        .top-title {
            font-size: 17px;
            font-weight: 700;
            color: var(--navy)
        }



        /* Main body */
        main {
            max-width: 1180px;
            width: 100%;
            margin: 0 auto;
            padding: 24px 22px 90px
        }

        .page-head {
            margin-bottom: 18px
        }

        .page-head h2 {
            font-size: 22px;
            color: var(--navy);
            margin-bottom: 3px;
            font-weight: 700
        }

        .page-head p {
            color: var(--gr);
            font-size: 13.5px
        }

        /* Stats */
        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 14px
        }

        .st {
            background: #fff;
            border: 1px solid var(--ln);
            border-radius: var(--radius);
            padding: 18px;
            color: var(--gr);
            font-size: 13.5px;
            box-shadow: var(--shadow-sm)
        }

        .st b {
            display: block;
            font-size: 32px;
            color: var(--navy);
            font-weight: 800;
            margin-bottom: 2px
        }

        /* Dashboard Action Bar */
        .dash-actions {
            display: flex;
            gap: 12px;
            margin: 20px 0 24px;
            flex-wrap: wrap
        }

        /* Panels */
        .panel {
            background: #fff;
            border: 1px solid var(--ln);
            border-radius: var(--radius);
            padding: 22px;
            margin-bottom: 24px;
            box-shadow: var(--shadow-sm);
        }

        .panel-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 16px;
            flex-wrap: wrap;
            gap: 8px
        }

        .panel-head h3 {
            margin: 0;
            font-size: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--navy)
        }

        .att-list {
            display: grid;
            gap: 10px
        }

        .att-item {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 11px 15px;
            border-radius: var(--radius-sm);
            background: #FFFBEB;
            border: 1px solid var(--warn-border);
            flex-wrap: wrap;
        }

        .att-item img {
            width: 44px;
            height: 54px;
            object-fit: cover;
            border-radius: var(--radius-sm);
            background: #eee
        }

        .att-info {
            flex: 1;
            min-width: 200px
        }

        .att-info b {
            display: block;
            font-size: 14px
        }

        .att-info small {
            color: var(--gr);
            font-size: 12px
        }

        .att-tags {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            margin-top: 4px
        }

        .att-all-ok {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 16px;
            background: var(--ok-bg);
            border: 1px solid var(--ok-border);
            border-radius: var(--radius-sm);
            color: var(--ok);
            font-size: 14px;
            font-weight: 500;
        }

        /* Category Cards */
        .cats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
            gap: 14px
        }

        .cc {
            background: #fff;
            border: 1px solid var(--ln);
            border-radius: var(--radius);
            padding: 18px;
            display: flex;
            flex-direction: column;
            transition: all .18s;
            box-shadow: var(--shadow-sm);
            position: relative;
        }

        .cc.clickable {
            cursor: pointer
        }

        .cc.clickable:hover {
            border-color: var(--cu);
            transform: translateY(-2px);
            box-shadow: var(--shadow)
        }

        .cc b {
            font-size: 26px;
            color: var(--navy);
            font-weight: 800;
            margin: 4px 0
        }

        .cc small {
            color: var(--gr);
            font-size: 12px
        }

        .cc .cc-arr {
            position: absolute;
            top: 16px;
            right: 16px;
            color: var(--gr-light);
            font-size: 16px;
            transition: transform .18s;
        }

        .cc.clickable:hover .cc-arr {
            transform: translateX(3px);
            color: var(--cu)
        }

        /* ========================================================================== */
        /* >>> MODERN DATA TABLE (MATCHING ATTACHED SCREENSHOT) <<<                   */
        /* ========================================================================== */
        .table-card {
            background: #fff;
            border: 1px solid var(--ln);
            border-radius: var(--radius);
            box-shadow: var(--shadow-sm);
            overflow: hidden;
        }

        .table-responsive {
            width: 100%;
            overflow-x: auto;
        }

        .data-table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            font-size: 13.5px;
        }

        .data-table th {
            background: #FAF9F7;
            color: var(--gr);
            font-size: 11.5px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: .6px;
            padding: 12px 16px;
            border-bottom: 1px solid var(--ln);
            white-space: nowrap;
            user-select: none;
        }

        .data-table td {
            padding: 14px 16px;
            border-bottom: 1px solid var(--ln);
            vertical-align: middle;
        }

        .data-table tbody tr {
            transition: background .15s ease;
        }

        .data-table tbody tr:hover {
            background: #FAF8F5;
        }

        .data-table tbody tr.selected {
            background: #F4F8FA;
        }

        .data-table tbody tr:last-child td {
            border-bottom: 0;
        }

        /* Status Pills (matching screenshot design) */
        .status-pill {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 3px 10px;
            border-radius: 18px;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: .4px;
            text-transform: uppercase;
            white-space: nowrap;
        }

        .status-pill.completed,
        .status-pill.published {
            background: #DDF3E6;
            color: var(--ok);
        }

        .status-pill.draft {
            background: #EDEBE8;
            color: #555;
        }

        .status-pill.failed,
        .status-pill.incomplete {
            background: #FEE2E2;
            color: var(--bad);
        }

        .status-pill.featured {
            background: #F6E3DB;
            color: var(--cu);
        }

        /* Table Row Actions */
        .row-actions {
            display: flex;
            align-items: center;
            gap: 6px;
            justify-content: flex-end;
        }

        .row-actions button {
            background: #fff;
            border: 1px solid var(--ln);
            border-radius: var(--radius-sm);
            padding: 5px 8px;
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            transition: all .15s;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            color: var(--navy);
        }

        .row-actions button.dng {
            color: var(--bad);
        }

        .row-actions button.dng:hover {
            border-color: var(--bad);
            background: var(--bad-bg);
        }

        .row-actions button:hover {
            border-color: var(--navy);
            background: #FAF9F7;
        }

        /* Collapsible Filter Toolbar */
        .filter-collapse-box {
            background: #fff;
            border: 1px solid var(--ln);
            border-radius: var(--radius);
            padding: 14px;
            margin-bottom: 16px;
            display: none;
            box-shadow: var(--shadow-sm);
        }

        .filter-collapse-box.open {
            display: block;
        }

        .flt-row {
            display: grid;
            grid-template-columns: 2fr 1fr 1fr 1fr;
            gap: 10px
        }

        .empty {
            background: #fff;
            border: 1px dashed var(--ln);
            padding: 48px 20px;
            text-align: center;
            color: var(--gr);
            border-radius: var(--radius)
        }

        /* ========================================================================== */
        /* >>> ARTWORKS VIEW MODES (DETAIL, IMAGE, SMALL IMAGE) <<<                   */
        /* ========================================================================== */
        .view-switcher {
            display: inline-flex;
            align-items: center;
            background: #fff;
            border: 1px solid var(--ln);
            border-radius: var(--radius-sm);
            padding: 2px;
            gap: 2px;
        }

        .view-btn {
            border: 0;
            background: transparent;
            color: var(--navy);
            padding: 5px 9px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            transition: all .15s ease;
        }

        .view-btn:hover {
            background: #FAF8F5;
            color: var(--cu);
        }

        .view-btn.active {
            background: var(--navy);
            color: #fff;
        }

        .art-subbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 9px 14px;
            background: #fff;
            border: 1px solid var(--ln);
            border-radius: var(--radius);
            margin-bottom: 16px;
            box-shadow: var(--shadow-sm);
            flex-wrap: wrap;
            gap: 10px;
        }

        /* Large Image Card View */
        .art-grid-layout {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 18px;
        }

        .art-card {
            background: #fff;
            border: 1px solid var(--ln);
            border-radius: var(--radius);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: transform .18s ease, box-shadow .18s ease, border-color .18s ease;
            box-shadow: var(--shadow-sm);
            position: relative;
        }

        .art-card:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow);
            border-color: var(--navy-light);
        }

        .art-card.selected {
            border-color: var(--navy);
            box-shadow: 0 0 0 2px var(--navy), var(--shadow);
        }

        .art-card-img-wrap {
            position: relative;
            width: 100%;
            aspect-ratio: 4/5;
            background: #FAF9F7;
            overflow: hidden;
            border-bottom: 1px solid var(--ln);
        }

        .art-card-img-wrap img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transition: transform .3s ease;
        }

        .art-card:hover .art-card-img-wrap img {
            transform: scale(1.02);
        }

        .art-card-chk-box {
            position: absolute;
            top: 10px;
            left: 10px;
            z-index: 3;
            background: rgba(255, 255, 255, .92);
            backdrop-filter: blur(4px);
            border-radius: 4px;
            padding: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 1px 4px rgba(0,0,0,.15);
        }

        .art-card-chk-box input {
            cursor: pointer;
            margin: 0;
            width: 16px;
            height: 16px;
        }

        .art-card-badges {
            position: absolute;
            top: 10px;
            right: 10px;
            z-index: 3;
            display: flex;
            flex-direction: column;
            gap: 4px;
            align-items: flex-end;
        }

        .art-card-badges .status-pill {
            box-shadow: 0 1px 4px rgba(0,0,0,.12);
        }

        .art-card-body {
            padding: 14px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            flex: 1;
        }

        .art-card-title-row {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 8px;
        }

        .art-card-title {
            font-size: 14.5px;
            font-weight: 700;
            color: var(--navy);
            line-height: 1.3;
            margin: 0;
            flex: 1;
            word-break: break-word;
        }

        .art-card-price {
            font-weight: 700;
            font-size: 14px;
            color: var(--cu);
            white-space: nowrap;
        }

        .art-card-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 11.5px;
            color: var(--gr);
        }

        .art-card-cats {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
        }

        .art-card-foot {
            margin-top: auto;
            padding-top: 10px;
            border-top: 1px solid var(--ln);
        }

        .art-card-actions {
            display: flex;
            gap: 6px;

        /* Floating Bulk Action Bar */

        /* Modal and Form Elements */

        .cat-badges-grid {

            flex-wrap: wrap;
            gap: 8px;
            margin: 6px 0 10px;
        }

        .cat-badge-btn {

            justify-content: center;
            padding: 7px 16px;
            font-size: 13px;

            font-weight: 500;
            background: #fff;
            border: 1.5px solid var(--ln);

        }

        .cat-badge-btn:hover {

            background: #FAF8F5;
            transform: translateY(-1px);
        }

        .cat-badge-btn.selected {
            background: var(--navy);
            color: #fff;
            border-color: var(--navy);
            font-weight: 600;

        }

            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 15px;
            height: 15px;
            border-radius: 50%;
            font-size: 10px;
            font-weight: 700;
            background: var(--ln);
            color: var(--gr);

        }

        .cat-badge-btn .badge-icon .lucide {

            height: 10px;

        }

        .cat-badge-btn.selected .badge-icon {
            background: var(--cu);
            color: #fff;
        }

        .cat-pill {
            display: inline-flex;
            align-items: center;
            background: #EEF2F6;
            color: var(--navy);
            font-size: 11px;
            font-weight: 600;
            padding: 2.5px 8px;
            border-radius: 12px;
            letter-spacing: .2px;
            border: 1px solid rgba(15, 39, 64, .08);

        }

        .chk {
            display: flex;
            gap: 10px;
            align-items: center;
            font-weight: 500
        }

        .chk input {
            width: auto
        }

        .fa {
            display: flex;
            gap: 10px;
            margin-top: 18px
        }

        /* ========================================================================== */
        /* >>> TOP-RIGHT FLOATING 3-SEC TOAST NOTIFICATION <<<                       */
        /* ========================================================================== */
        #toast {
            position: fixed;
            top: 24px;
            right: 24px;
            left: auto;
            bottom: auto;
            transform: none;
            background: var(--navy);
            color: #FFFFFF;
            padding: 0;
            border-radius: var(--radius);
            z-index: 100000;
            min-width: 270px;
            max-width: 400px;
            box-shadow: var(--shadow-lg);
            border: 1px solid rgba(255, 255, 255, 0.16);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            animation: toastSlideIn 0.22s ease-out forwards;
            pointer-events: auto;
        }

        #toast[hidden] {
            display: none !important;
        }

        #toast.hiding {
            animation: toastSlideOut 0.2s ease-in forwards;
        }

        .toast-body {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px 18px;
        }

        .toast-icon {
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .toast-msg {
            flex: 1;
            font-size: 13.5px;
            font-weight: 500;
            line-height: 1.4;
            color: #FFFFFF;
            word-break: break-word;
        }

        .toast-bar {
            height: 3px;
            background: rgba(255, 255, 255, 0.15);
            width: 100%;
            overflow: hidden;
        }

        .toast-progress {
            height: 100%;
            width: 100%;
            background: var(--ok); /* Standard CraftVeda success green (#1B7F4B) */
            animation: toastCountdown 3s linear forwards;
            transform-origin: left center;
        }

        #toast.err {
            background: var(--bad); /* Standard CraftVeda error red (#B3261E) */
            border-color: rgba(255, 255, 255, 0.25);
        }

        #toast.err .toast-progress {
            background: #FFFFFF;
        }

        #toast.busy .toast-bar {
            display: block;
        }

        #toast.busy .toast-progress {
            background: var(--cu); /* Standard CraftVeda copper (#B5654A) */
            animation: toastBusyPulse 1.2s infinite ease-in-out;
        }

        @keyframes toastSlideIn {
            from {
                opacity: 0;
                transform: translateX(30px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        @keyframes toastSlideOut {
            from {
                opacity: 1;
                transform: translateX(0);
            }
            to {
                opacity: 0;
                transform: translateX(25px);
            }
        }

        @keyframes toastCountdown {
            from {
                width: 100%;
            }
            to {
                width: 0%;
            }
        }

        @keyframes toastBusyPulse {
            0% {
                transform: translateX(-100%);
            }
            50% {
                transform: translateX(0);
            }
            100% {
                transform: translateX(100%);
            }
        }

        @keyframes toastSpin {
            to {
                transform: rotate(360deg);
            }
        }

        .toast-spinner {
            animation: toastSpin 0.9s linear infinite;
        }

        @media (max-width: 600px) {
            #toast {
                top: 14px;
                right: 14px;
                left: 14px;
                max-width: calc(100vw - 28px);
                min-width: 0;
            }
        }

    <script>
        /* ========================================================================== */
        /* >>> DEFAULT CONFIG & SETTINGS <<<                                          */
        /* ========================================================================== */
        const DEFAULT_BENTO = [
            { id: "b1", title: "Charcoal Sketch", type: "th", target: "Charcoal Sketch", shape: "short", image: "images/moonlit-ocean-textured-art-1-mve6abow.jpg" },
            { id: "b2", title: "Textured Art", type: "cat", target: "Textured Art", shape: "tall", image: "images/sacred-ghats-textured-art-1-mvcvio9x.jpg" },
            { id: "b3", title: "Religious", type: "cat", target: "Religious", shape: "tall", image: "images/himalayan-sunset-textured-art-1-mvcum37v.jpg" },
            { id: "b4", title: "Pencil Sketch", type: "th", target: "Pencil Sketch", shape: "short", image: "images/serene-buddha-textured-art-1-mve4poic.jpg" },
            { id: "b5", title: "Abstract Art", type: "cat", target: "Abstract Art", shape: "short", image: "images/earth-tones-cracked-texture-art-1-mve5xasd.jpg" },
            { id: "b6", title: "Nature", type: "cat", target: "Nature", shape: "tall", image: "images/golden-moon-owls-textured-art-1-mve4ry4e.jpg" },
            { id: "b7", title: "Custom Art", type: "cat", target: "Custom Art", shape: "tall", image: "images/ram-sita-watercolor-art-1-mvcvdlzc.jpg" },
            { id: "b8", title: "Vastu", type: "cat", target: "Vastu", shape: "short", image: "images/golden-horizon-sunset-textured-art-1-mve5rwrq.jpg" }
        ];

        const DEFAULT_SETTINGS = {
            categories: ["Textured Art", "Abstract Art", "Vastu", "Nature", "Religious", "Custom Art"],
            themes: {
                "Religious": ["Ganesha", "Shiva", "Radha Krishna", "Hanuman", "Buddha"],
                "Custom Art": ["Pencil Sketch", "Charcoal Sketch", "Charcoal Painting", "Abstract Painting", "Portrait Sketch"]
            },
            bento: JSON.parse(JSON.stringify(DEFAULT_BENTO))
        };

        let settings = JSON.parse(JSON.stringify(DEFAULT_SETTINGS));
        let CATS = [...settings.categories];
        let THEMES = JSON.parse(JSON.stringify(settings.themes));
        let selectedBentoIndex = 0;
        let bentoDeviceMode = "laptop"; // "laptop" | "tablet" | "mobile"

        const SHAPES = ["Horizontal", "Square", "Vertical"];

        /* Standard Shape-based Sizes */
        const SHAPE_SIZES = {
            "Horizontal": ["24*16 inch", "36*24 inch", "48*32 inch"],
            "Vertical": ["16*24 inch", "24*36 inch", "32*48 inch"],
            "Square": ["24*24 inch", "36*36 inch", "48*48 inch"]
        };

        /* Fallback templates derived from CATALOG and Shape Sizing */
        const DEFAULT_TEMPLATES = [
            { id: "tpl-textured", category: "Textured Art", shape: "Horizontal", sizes: [["24*16 inch", 15000], ["36*24 inch", 19000], ["48*32 inch", 25000]], desc: "Thick texture and layered relief built by hand on stretched canvas, finished in acrylic colours." },
            { id: "tpl-abstract", category: "Abstract Art", shape: "Square", sizes: [["24*24 inch", 9000], ["36*36 inch", 12000], ["48*48 inch", 16000]], desc: "Hand painted abstract artwork on stretched canvas, finished in acrylic colours." },
            { id: "tpl-vastu", category: "Vastu", shape: "Horizontal", sizes: [["24*16 inch", 10000], ["36*24 inch", 14000], ["48*32 inch", 20000]], desc: "Hand painted Vastu artwork on stretched canvas, made with colours and symbols traditionally considered auspicious." },
            { id: "tpl-nature", category: "Nature", shape: "Horizontal", sizes: [["24*16 inch", 7000], ["36*24 inch", 9500], ["48*32 inch", 13500]], desc: "Hand painted nature artwork on stretched canvas, finished in acrylic colours." },
            { id: "tpl-religious", category: "Religious", shape: "Vertical", sizes: [["16*24 inch", 8000], ["24*36 inch", 10500], ["32*48 inch", 14500]], desc: "Hand painted devotional artwork on stretched canvas, finished in acrylic colours." },
            { id: "tpl-custom", category: "Custom Art", shape: "Vertical", sizes: [["16*24 inch", 4500], ["24*36 inch", 7000], ["32*48 inch", 11000]], desc: "Made to order from your idea or photo, by hand, in the medium you choose." }
        ];
        let templates = [...DEFAULT_TEMPLATES];

        const $ = s => document.querySelector(s);
        const money = n => "Rs. " + Number(n).toLocaleString("en-IN");
        const esc = t => String(t == null ? "" : t).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

        /* SVG Placeholder generator for missing/loading images */
        const ph = (n, k = 0) => {
            let h = 0;
            const str = String(n || "Art");
            for (const c of str) h = (h * 31 + c.charCodeAt(0)) % 360;
            const g = `<defs><linearGradient id='g' x1='0' y1='0' x2='1' y2='1'><stop offset='0' stop-color='hsl(${h},35%,26%)'/><stop offset='1' stop-color='hsl(${(h + 45) % 360},45%,64%)'/></linearGradient></defs>`;
            const b = `<rect width='400' height='500' fill='url(#g)'/><circle cx='285' cy='165' r='88' fill='hsla(${h},30%,92%,.28)'/><path d='M0 410 L120 285 L210 365 L300 255 L400 385 V500 H0Z' fill='hsla(${h},40%,14%,.45)'/>`;
            return "data:image/svg+xml," + encodeURIComponent(`<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 400 500'>${g}${b}</svg>`);
        };
        const slug = t => t.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "").slice(0, 40) || "art";

        let data = { items: [] }, view = "dash", Q = "", FC = "", FS = "", QSORT = "updated-desc", filtersOpen = false, selectedCatForThemes = null, tt;
        let selectedIds = new Set();
        let artworkViewMode = localStorage.getItem("craftveda_artwork_view_mode") || "detail"; // "detail" | "image" | "small"

        function hideToast() {
            const t = $("#toast");
            if (!t || t.hidden) return;
            clearTimeout(tt);
            t.classList.add("hiding");
            setTimeout(() => {
                t.hidden = true;
                t.classList.remove("hiding");
                t.innerHTML = "";
            }, 200);
        }

        function toast(m, err) {
            const t = $("#toast");
            if (!t) return;
            clearTimeout(tt);
            if (!m) {
                hideToast();
                return;
            }

            const isErr = !!err;
            t.className = isErr ? "err" : "";
            t.hidden = false;

            const iconHtml = isErr
                ? `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>`
                : `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>`;

            t.innerHTML = `
                <div class="toast-body">
                    <div class="toast-icon">${iconHtml}</div>
                    <div class="toast-msg">${esc(String(m))}</div>
                </div>
                <div class="toast-bar">
                    <div class="toast-progress"></div>
                </div>
            `;

            // Automatically disappears in exactly 3 seconds with visual countdown line
            tt = setTimeout(() => {
                hideToast();
            }, 3000);
        }

        const busy = m => {
            const t = $("#toast");
            if (!t) return;
            clearTimeout(tt);
            if (!m) {
                hideToast();
                return;
            }
            t.className = "busy";
            t.hidden = false;

            t.innerHTML = `

        function timeAgo(dateStr) {
            if (!dateStr) return "Recently";
            const d = new Date(dateStr);
            if (isNaN(d.getTime())) return "Recently";
            const secs = Math.floor((Date.now() - d.getTime()) / 1000);
            if (secs < 60) return "Just now";
            const mins = Math.floor(secs / 60);
            if (mins < 60) return `${mins}m ago`;
            const hours = Math.floor(mins / 60);
            if (hours < 24) return `${hours}h ago`;
            const days = Math.floor(hours / 24);
            if (days < 30) return `${days}d ago`;
            return d.toLocaleDateString("en-IN", { month: "short", day: "numeric", year: "numeric" });
        }

        function checkCompleteness(it) {
            const issues = [];
            if (!it.name || !it.name.trim()) issues.push("Missing name");
            if (!it.images || !it.images[0]) issues.push("Missing cover image");
            const validSizes = (it.sizes || []).filter(s => s[0] && +s[1] > 0);
            if (!validSizes.length) issues.push("Missing sizes or prices");
            return {
                isComplete: issues.length === 0,
                issues
            };
        }

        function getItemCategories(it) {
            if (!it) return [];
            if (Array.isArray(it.categories) && it.categories.length) {

            }
            if (typeof it.category === "string" && it.category.trim()) {
                return it.category.split(/[,;|]/).map(s => s.trim()).filter(Boolean);
            }
            return [];
        }

        const enc64 = s => { let r = ""; new TextEncoder().encode(s).forEach(c => r += String.fromCharCode(c)); return btoa(r) };
        const dec64 = b => new TextDecoder().decode(Uint8Array.from(atob(b.replace(/\s/g, "")), c => c.charCodeAt(0)));

        async function load() {

            if (r.status === 401 || r.status === 403) throw new Error("Token not accepted. Check the token and its Contents permission.");
            if (!r.ok) throw new Error("GitHub error " + r.status + ". Check the repository name and branch.");
            const j = await r.json(); sha = j.sha; data = JSON.parse(dec64(j.content)); if (!Array.isArray(data.items)) data.items = [];

                }
            } catch (e) { }

            /* Fallback to localStorage or static fetch if gh didn't yield sha */
            if (!settingsSha) {
                try {
                    const localS = localStorage.getItem("cv_settings");
                    if (localS) {
                        const sdata = JSON.parse(localS);

                if (r.ok) { sha = (await r.json()).content.sha; return }

                throw new Error("Could not save (" + r.status + ")")
            }
            throw new Error("Could not save. Please try again.")
        }

                        ...(settingsSha ? { sha: settingsSha } : {})
                    }

                    settingsSha = resJson.content?.sha || resJson.sha;
                    CATS = [...settings.categories];
                    THEMES = JSON.parse(JSON.stringify(settings.themes || {}));

        async function putImage(name, b64) {
            const path = "images/" + name;
            let imgSha;
            const existing = await gh(path, { q: "?ref=" + cfg.branch + "&t=" + Date.now() });
            if (existing.ok) { const item = await existing.json(); imgSha = item.sha }
            else if (existing.status !== 404) throw new Error("Could not check image (" + existing.status + ")");
            const r = await gh(path, { method: "PUT", body: { message: (imgSha ? "Update " : "Add ") + "image " + name, content: b64, branch: cfg.branch, ...(imgSha ? { sha: imgSha } : {}) } });
            if (!r.ok) throw new Error("Image upload failed (" + r.status + ")");
            return path
        }

        function isImageInUse(imgUrl, excludeArtworkId = null) {
            if (!imgUrl || typeof imgUrl !== "string") return false;
            const clean = imgUrl.replace(/^\/+/, "");
            const inArtworks = (data.items || []).some(item => {
                if (excludeArtworkId && item.id === excludeArtworkId) return false;
                return (item.images || []).some(img => img && img.replace(/^\/+/, "") === clean);
            });
            if (inArtworks) return true;
            if (typeof settings !== "undefined" && settings && Array.isArray(settings.bento)) {
                if (settings.bento.some(t => t.image && t.image.replace(/^\/+/, "") === clean)) return true;
            }
            return false;
        }

        async function delImage(p) {
            if (!p || typeof p !== "string") return;
            const clean = p.replace(/^\/+/, "");
            const path = clean.startsWith("images/") ? clean : "images/" + clean;

            for (let i = 0; i < 3; i++) {
                try {
                    const g = await gh(path, { q: `?ref=${cfg.branch}&t=${Date.now()}` });
                    if (g.status === 404) return;
                    if (!g.ok) {
                        console.warn(`[delImage] Could not check ${path} (${g.status})`);
                        await new Promise(r => setTimeout(r, 600));
                        continue;
                    }
                    const info = await g.json().catch(() => null);
                    if (!info || !info.sha) return;

                    const r = await gh(path, {
                        method: "DELETE",
                        body: {
                            message: "Remove " + path,
                            sha: info.sha,
                            branch: cfg.branch
                        }
                    });
                    if (r.ok || r.status === 404) return;
                    if (r.status === 409 || r.status === 422) {
                        await new Promise(r => setTimeout(r, 800));
                        continue;
                    }
                    console.warn(`[delImage] Failed to delete ${path}: status ${r.status}`);
                    return;
                } catch (e) {
                    console.warn(`[delImage] Error deleting ${path}:`, e);
                    await new Promise(r => setTimeout(r, 600));
                }
            }
        }

                    const k = fit === "cover" ? Math.max(W / im.width, H / im.height) : Math.min(W / im.width, H / im.height), w = im.width * k, h = im.height * k; x.drawImage(im, (W - w) / 2, (H - h) / 2, w, h); ok(c.toDataURL("image/jpeg", .85).split(",")[1])

            })

        function getFilteredAndSorted() {
            let l = data.items.filter(i => {
                const matchesName = !Q || i.name.toLowerCase().includes(Q.toLowerCase());
                const matchesCat = !FC || getItemCategories(i).includes(FC);
                let matchesStatus = true;
                if (FS === "p") matchesStatus = (i.published !== false);
                else if (FS === "d") matchesStatus = (i.published === false);
                else if (FS === "inc") matchesStatus = !checkCompleteness(i).isComplete;
                return matchesName && matchesCat && matchesStatus;
            });

            const minPrice = it => (it.sizes && it.sizes.length) ? Math.min(...it.sizes.map(s => +s[1] || 0)) : 0;

            if (QSORT === "updated-desc") {
                l.sort((a, b) => new Date(b.updatedAt || b.createdAt || 0) - new Date(a.updatedAt || a.createdAt || 0));
            } else if (QSORT === "name-asc") {
                l.sort((a, b) => a.name.localeCompare(b.name));
            } else if (QSORT === "price-asc") {
                l.sort((a, b) => minPrice(a) - minPrice(b));
            } else if (QSORT === "price-desc") {
                l.sort((a, b) => minPrice(b) - minPrice(a));
            } else if (QSORT === "cat-asc") {
                l.sort((a, b) => getItemCategories(a).join(", ").localeCompare(getItemCategories(b).join(", ")));
            }

            return l;

        function exportCurrentArtworksCSV() {
            const itemsToExport = getFilteredAndSorted();
            if (!itemsToExport.length) {
                return toast("No artworks match current filter to export", 1);
            }
            const headers = ["Name", "Category", "Theme", "Shape", "Sizes", "Description", "Published", "Featured", "UpdatedAt"];
            const rowsData = [headers];

            itemsToExport.forEach(it => {
                const sizesStr = (it.sizes || []).map(s => `${s[0]}:${s[1]}`).join("|");
                rowsData.push([
                    it.name || "",
                    getItemCategories(it).join(", "),
                    it.theme || "",
                    it.shape || "",
                    sizesStr,
                    it.desc || "",
                    it.published !== false ? "true" : "false",
                    it.featured ? "true" : "false",
                    it.updatedAt || it.createdAt || ""
                ]);
            });

            const csvContent = rowsData.map(r => r.map(cell => {
                const s = String(cell).replace(/"/g, '""');
                return `"${s}"`;
            }).join(",")).join("\n");

            const blob = new Blob([csvContent], { type: "text/csv;charset=utf-8;" });
            const url = URL.createObjectURL(blob);
            const a = document.createElement("a");
            const dateStr = new Date().toISOString().split("T")[0];
            a.href = url;
            a.download = `craftveda_artworks_${dateStr}.csv`;

        function toBentoJpeg(file, shape) {
            return new Promise((ok, no) => {
                const im = new Image();
                im.onload = () => {
                    const W = 1080;
                    const H = shape === 'tall' ? 1200 : 795;
                    const c = document.createElement("canvas");
                    c.width = W;
                    c.height = H;
                    const x = c.getContext("2d");
                    x.fillStyle = "#fff";
                    x.fillRect(0, 0, W, H);
                    const k = Math.max(W / im.width, H / im.height);
                    const w = im.width * k, h = im.height * k;
                    x.drawImage(im, (W - w) / 2, (H - h) / 2, w, h);
                    ok(c.toDataURL("image/jpeg", .88).split(",")[1]);
                };
                im.onerror = () => no(new Error("That file is not an image"));
                im.src = URL.createObjectURL(file);
            });
        }

            Object.entries(THEMES || {}).forEach(([cat, list]) => {
                (list || []).forEach(th => {
                    if (th) targets.push({ type: "th", name: th, label: `Theme: ${th} (${cat})` });
                });
            });
            return targets;
        }

        function getNextBentoTarget() {
            const all = getAvailableBentoTargets();
            if (!all.length) return { type: "cat", name: "Textured Art", label: "Category: Textured Art" };
            const used = new Set((settings.bento || []).map(t => (t.target || t.title || "").trim().toLowerCase()));
            const unused = all.find(t => !used.has(t.name.trim().toLowerCase()));
            if (unused) return unused;
            const idx = (settings.bento || []).length % all.length;
            return all[idx];

        function autoMatchTileImage(targetName) {
            if (!targetName) return ph("Art");
            const tgt = targetName.trim().toLowerCase();
            if (Array.isArray(data.items) && data.items.length) {
                // 1. Direct match on theme or category
                let match = data.items.find(x => {
                    const cats = getItemCategories(x).map(s => s.toLowerCase());
                    const th = (x.theme || "").toLowerCase();
                    return cats.includes(tgt) || th === tgt;
                });
                if (match && match.images && match.images[0]) return match.images[0];

                // 2. Find parent category if target is a theme
                for (const [cat, themes] of Object.entries(THEMES || {})) {
                    if ((themes || []).some(t => t.toLowerCase() === tgt)) {
                        match = data.items.find(x => getItemCategories(x).map(s => s.toLowerCase()).includes(cat.toLowerCase()));
                        if (match && match.images && match.images[0]) return match.images[0];
                    }
                }

                // 3. Any catalog item with an image
                const anyItem = data.items.find(x => x.images && x.images[0]);
                if (anyItem && anyItem.images && anyItem.images[0]) return anyItem.images[0];
            }
            return ph(targetName);

        }

        function bindBentoEvents() {
            // Direct Device Mode Tabs
            document.querySelectorAll("[data-device-mode]").forEach(pill => {
                pill.onclick = () => {
                    bentoDeviceMode = pill.dataset.deviceMode;
                    toast(`Switched preview to ${bentoDeviceMode.toUpperCase()} screen`);
                    render();
                };
            });

            // Drag and drop & Click handling on tiles
            let draggedTileIdx = null;
            document.querySelectorAll(".bt-tile-admin").forEach(el => {
                el.addEventListener("dragstart", e => {
                    draggedTileIdx = +el.dataset.tileIdx;
                    e.dataTransfer.setData("text/plain", String(draggedTileIdx));
                    e.dataTransfer.effectAllowed = "move";
                    el.classList.add("dragging");
                });

                el.addEventListener("dragend", () => {
                    el.classList.remove("dragging");
                    document.querySelectorAll(".bt-tile-admin").forEach(x => x.classList.remove("drag-over"));
                });

                el.addEventListener("dragover", e => {
                    e.preventDefault();
                    e.dataTransfer.dropEffect = "move";
                    const targetIdx = +el.dataset.tileIdx;
                    if (targetIdx !== draggedTileIdx) {
                        el.classList.add("drag-over");
                    }
                });

                el.addEventListener("dragleave", () => {
                    el.classList.remove("drag-over");
                });

                el.addEventListener("drop", e => {
                    e.preventDefault();
                    el.classList.remove("drag-over");
                    const targetIdx = +el.dataset.tileIdx;
                    if (draggedTileIdx !== null && draggedTileIdx !== targetIdx && settings.bento[draggedTileIdx]) {
                        const movedItem = settings.bento.splice(draggedTileIdx, 1)[0];
                        settings.bento.splice(targetIdx, 0, movedItem);
                        selectedBentoIndex = targetIdx;
                        toast(`Moved "${movedItem.title}" to position #${targetIdx + 1}`);
                        draggedTileIdx = null;
                        render();
                    }
                });

                el.addEventListener("click", e => {
                    if (e.target.closest(".bt-resize-handle")) return;
                    const tileIdx = +el.dataset.tileIdx;
                    if (!isNaN(tileIdx)) {
                        selectedBentoIndex = tileIdx;
                        render();
                    }
                });
            });

            // Corner Resize Handles (Click to toggle & Mouse drag to resize per screen)
            document.querySelectorAll(".bt-resize-handle").forEach(handle => {
                handle.onclick = e => {
                    e.stopPropagation();
                    const idx = +handle.dataset.resizeIdx;
                    if (settings.bento[idx]) {
                        const tile = settings.bento[idx];
                        const curShape = getTileShape(tile, bentoDeviceMode);
                        const nextShape = curShape === "tall" ? "short" : "tall";
                        if (bentoDeviceMode === "tablet") {
                            tile.shapeTablet = nextShape;
                        } else if (bentoDeviceMode === "mobile") {
                            tile.shapeMobile = nextShape;
                        } else {
                            tile.shape = nextShape;
                        }
                        toast(`Resized Tile #${idx + 1} for ${bentoDeviceMode.toUpperCase()} to ${nextShape.toUpperCase()}`);
                        render();
                    }
                };

                handle.onmousedown = e => {
                    e.stopPropagation();
                    const idx = +handle.dataset.resizeIdx;
                    const tileEl = handle.closest(".bt-tile-admin");
                    if (!tileEl || !settings.bento[idx]) return;
                    const startY = e.clientY;
                    const initialShape = getTileShape(settings.bento[idx], bentoDeviceMode);
                    let currentShape = initialShape;

                    const onMouseMove = ev => {
                        const dy = ev.clientY - startY;
                        if (dy > 30 && currentShape !== "tall") {
                            currentShape = "tall";
                            tileEl.classList.remove("short");
                            tileEl.classList.add("tall");
                        } else if (dy < -30 && currentShape !== "short") {
                            currentShape = "short";
                            tileEl.classList.remove("tall");
                            tileEl.classList.add("short");
                        }
                    };

                    const onMouseUp = () => {
                        window.removeEventListener("mousemove", onMouseMove);
                        window.removeEventListener("mouseup", onMouseUp);
                        if (currentShape !== initialShape) {
                            if (bentoDeviceMode === "tablet") {
                                settings.bento[idx].shapeTablet = currentShape;
                            } else if (bentoDeviceMode === "mobile") {
                                settings.bento[idx].shapeMobile = currentShape;
                            } else {
                                settings.bento[idx].shape = currentShape;
                            }
                            toast(`Resized Tile #${idx + 1} for ${bentoDeviceMode.toUpperCase()} to ${currentShape.toUpperCase()}`);
                            render();
                        }
                    };

                    window.addEventListener("mousemove", onMouseMove);
                    window.addEventListener("mouseup", onMouseUp);
                };
            });

            const curTile = settings.bento[selectedBentoIndex] || settings.bento[0];

            // Card Display Name Input
            const titleIn = $("#bento-title-in");
            if (titleIn) {
                titleIn.oninput = e => {
                    const newTitle = e.target.value;
                    curTile.title = newTitle;
                    const previewTitle = document.querySelector(`.bt-tile-admin[data-tile-idx="${selectedBentoIndex}"] .bt-tile-title`);
                    if (previewTitle) previewTitle.textContent = newTitle;
                };
                titleIn.onchange = async () => {
                    busy("Saving tile name...");
                    try {
                        await saveSettings(`Renamed Bento tile to "${curTile.title}"`);
                        toast(`Saved title "${curTile.title}"`);
                    } catch (err) {
                        toast(err.message, 1);
                    }
                    render();
                };
            }

            // Unified Category / Theme Select (Sets Title & Link and auto-saves)
            const targetSelect = $("#bento-target-select");
            if (targetSelect) {
                targetSelect.onchange = async () => {
                    const val = targetSelect.value;
                    let newType = "cat";
                    let newTarget = "";
                    if (val.startsWith("cat:")) {
                        newType = "cat";
                        newTarget = val.slice(4);
                    } else if (val.startsWith("th:")) {
                        newType = "th";
                        newTarget = val.slice(3);
                    }
                    curTile.type = newType;
                    curTile.target = newTarget;
                    curTile.title = newTarget;

                    // If tile has no image or current image was an auto-match, update to new category/theme image
                    const matched = autoMatchTileImage(newTarget);
                    if (matched) curTile.image = matched;

                    busy(`Saving Bento tile changes...`);
                    try {
                        await saveSettings(`Linked Bento tile #${selectedBentoIndex + 1} to "${curTile.title}"`);
                        toast(`Linked Tile #${selectedBentoIndex + 1} to "${curTile.title}"`);
                    } catch (err) {
                        toast(err.message, 1);
                    }
                    render();
                };
            }

            // Independent Screen Size Pill Buttons (Laptop, Tablet, Mobile)
            document.querySelectorAll(".size-pill-btn").forEach(btn => {
                btn.onclick = () => {
                    const screen = btn.dataset.screen;
                    const size = btn.dataset.size;
                    if (screen === "laptop") {
                        curTile.shape = size;
                    } else if (screen === "tablet") {
                        curTile.shapeTablet = size;
                    } else if (screen === "mobile") {
                        curTile.shapeMobile = size;
                    }
                    toast(`Set ${screen.toUpperCase()} sizing to ${size.toUpperCase()}`);
                    render();
                };
            });

            // 4-Way Move Grid (Left, Right, Up, Down)
            const moveLeftBtn = $("#bento-move-left");
            const moveRightBtn = $("#bento-move-right");
            const moveUpBtn = $("#bento-move-up");
            const moveDownBtn = $("#bento-move-down");

            if (moveLeftBtn) {
                moveLeftBtn.onclick = () => {
                    if (selectedBentoIndex >= 2) {
                        const temp = settings.bento[selectedBentoIndex];
                        settings.bento[selectedBentoIndex] = settings.bento[selectedBentoIndex - 2];
                        settings.bento[selectedBentoIndex - 2] = temp;
                        selectedBentoIndex -= 2;
                        render();
                    }
                };
            }

        function parseCSV(t) {
            const r = []; let row = [], c = "", q = false;
            for (let i = 0; i < t.length; i++) {
                const ch = t[i];
                if (q) {
                    if (ch === '"') { if (t[i + 1] === '"') { c += '"'; i++ } else q = false }
                    else c += ch;
                } else if (ch === '"') q = true;
                else if (ch === ',') { row.push(c); c = "" }
                else if (ch === '\n') { row.push(c); r.push(row); row = []; c = "" }
                else if (ch !== '\r') c += ch;
            }
            if (c || row.length) { row.push(c); r.push(row) }
            return r;
        }

                        const catIdx = headers.indexOf("category");

                        const descIdx = headers.indexOf("description") >= 0 ? headers.indexOf("description") : headers.indexOf("desc");

                        parsedItems = [];
                        for (let i = 1; i < rows.length; i++) {
                            const r = rows[i];
                            const name = (r[nameIdx] || "").trim();
                            if (!name) continue;

                            const rawCat = catIdx >= 0 ? (r[catIdx] || "").trim() : "";

                            const theme = themeIdx >= 0 ? (r[themeIdx] || "").trim() : "";
                            let shape = shapeIdx >= 0 ? (r[shapeIdx] || "").trim() : "";
                            if (!SHAPES.includes(shape)) {
                                const tpl = templates.find(t => categories.includes(t.category)) || DEFAULT_TEMPLATES.find(t => categories.includes(t.category));

                            }

                            let sizes = [];
